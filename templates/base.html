<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Matchline ATS{% endblock %}</title>
    <meta name="description" content="A clearer way to understand how your resume matches a role.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="/" aria-label="Matchline home">
                <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
                <span>matchline<span class="brand-dot">.</span></span>
            </a>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="/" class="{% if active_page == 'home' %}is-active{% endif %}">How it works</a>
                <a href="/account" class="{% if active_page == 'account' %}is-active{% endif %}">My analyses</a>
                <a href="/analyze" class="nav-cta">Start an analysis <span aria-hidden="true">↗</span></a>
            </nav>
        </header>
        <main>{% block content %}{% endblock %}</main>
        <footer class="site-footer">
            <span>Matchline ATS</span>
            <span>Read the role. Refine the story.</span>
        </footer>
    </div>
</body>
</html>
